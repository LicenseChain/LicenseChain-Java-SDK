name: Publish to Maven Central

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Maven 3.10 stages maven-metadata-local.xml; central-publishing-maven-plugin
      # 0.11.0 leaves it in the bundle and Central rejects with
      # "Bundle has content that does NOT have a .pom file".
      - name: Install Maven 3.9.9
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz \
            | sudo tar -xzC /opt
          echo "/opt/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"

      - name: Set up JDK 17 and Maven Central credentials
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Show Maven version
        run: mvn -version

      - name: Publish to Maven Central
        run: mvn -B clean deploy -Prelease
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
